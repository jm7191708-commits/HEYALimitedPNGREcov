name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax & Env Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check server.js syntax
        run: node --check server.js

      - name: Check all ESM source files
        run: |
          find . \
            -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            -not -name "*.min.js" \
            -not -name "*.cjs" \
            -not -path "./admin-dashboard/backend/*" \
            -not -path "./scripts/test-*" \
          | while read f; do
              node --input-type=module < "$f" 2>&1 | grep -i "SyntaxError" && echo "FAIL: $f" || true
            done

      - name: Validate Render environment config
        run: node scripts/validate-render-env.js
        env:
          NODE_ENV: production
          MCP_SECRET: ci-placeholder
          ROXANNE_MCP_SECRET: ci-placeholder

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Loading Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .loader {
      width: 360px;
      height: 360px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      width: 185px;
      height: 185px;
      object-fit: contain;
      position: absolute;
      z-index: 2;
      border-radius: 24px;
    }

    .spinner {
      width: 320px;
      height: 320px;
      position: absolute;
      z-index: 1;
      animation: rotation 0.75s linear infinite;
      filter: drop-shadow(0 0 10px rgba(245, 169, 0, 0.35));
    }

    .path {
      stroke-dasharray: 100;
      stroke-dashoffset: 20;
      stroke-linecap: round;
    }

    @keyframes rotation {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .loader {
        width: 260px;
        height: 260px;
      }

      .spinner {
        width: 240px;
        height: 240px;
      }

      .logo {
        width: 135px;
        height: 135px;
      }
    }
  </style>
</head>
